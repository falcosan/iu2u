name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Check that the tag matches the versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" = "$version"
          test "$(jq -r .version plugins/iu2u/.claude-plugin/plugin.json)" = "$version"
          test "$(jq -r '.plugins[0].source.ref' .claude-plugin/marketplace.json)" = "$GITHUB_REF_NAME"
      - name: Check whether crates.io has this version
        id: crates
        run: |
          if curl -sfA "iu2u release (github.com/${GITHUB_REPOSITORY})" "https://crates.io/api/v1/crates/iu2u/${GITHUB_REF_NAME#v}" > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
        if: steps.crates.outputs.published != 'true'
        id: auth
      - name: Publish to crates.io
        if: steps.crates.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
