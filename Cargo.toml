[package]
name = "iu2u"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Decision-model powers for coding agents: any decision model, local or hosted, as MCP tools and hooks"
license = "Apache-2.0"
repository = "https://github.com/falcosan/iu2u"
keywords = ["mcp", "claude-code", "codex", "decision-model", "agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.13", features = ["json"] }
rmcp = { version = "3.9", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1.54", features = ["fs", "io-std", "io-util", "net", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "libc", "HIServices", "AXUIElement", "AXError", "AXValue"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFBase", "CFCGTypes", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "libc", "CGEvent", "CGEventTypes", "CGRemoteOperation"] }

[dev-dependencies]
rmcp = { version = "3.9", features = ["client"] }
tokio = { version = "1.54", features = ["macros", "test-util"] }
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
