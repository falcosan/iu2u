[package]
name = "iu2u"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Decision-model powers for coding agents: any System One model, local or hosted, as MCP tools and hooks"
license = "Apache-2.0"
repository = "https://github.com/OWNER/iu2u"
keywords = ["mcp", "claude-code", "codex", "decision-model", "agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
reqwest = { version = "0.13", features = ["json"] }
rmcp = { version = "3.9", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
rmcp = { version = "3.9", features = ["client"] }
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
